name: OptometryReview
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  OptometryReview:
    type: application
    platform: iOS
    info:
      path: OptometryReview/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: OptometryReview
    postCompileScripts:
      - name: Copy question resources
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/copy_bank_resources.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
    # Debug only: plain-HTTP local stub servers (-aiBaseURL / -aiFallbackURL / -usageBaseURL). Release keeps the default ATS policy.
    postBuildScripts:
      - name: Allow local networking (Debug)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$plist"
          fi
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.optometryreview
        PRODUCT_NAME: OptometryReview
        INFOPLIST_KEY_CFBundleDisplayName: 驗光錯題本
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone stays portrait; iPad turns every way (needed for Split View and Slide Over).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  OptometryReviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OptometryReviewTests
    dependencies:
      - target: OptometryReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.optometryreview.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OptometryReview.app/OptometryReview
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  OptometryReview:
    build:
      targets:
        OptometryReview: all
        OptometryReviewTests: [test]
    test:
      targets:
        - OptometryReviewTests
